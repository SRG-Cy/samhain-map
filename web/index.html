<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Samhain Map</title>
  <meta name="description" content="Irish ghost and fairy stories from public-domain books, 1825 to 1914, put back on the map. Places found by an open-weight model, checked by code against real townlands.">
  <meta name="theme-color" content="#121a24">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <header class="top">
    <h1 class="wordmark"><span class="flame" aria-hidden="true"></span>Samhain Map</h1>
    <p class="tagline">Irish ghost stories from old books, put back where they happened</p>
  </header>

  <main class="layout">
    <div id="map" aria-label="Map of Ireland: orange lights are places stories name, white ghosts are famous haunted sites"></div>
    <aside class="leaf" id="panel" aria-live="polite">
      <div id="panel-body"></div>
    </aside>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
